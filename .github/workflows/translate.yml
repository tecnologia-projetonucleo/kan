name: Translate

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --filter @kan/web...

      - name: Extract translations
        working-directory: apps/web
        run: pnpm lingui:extract

      - name: Lingo.dev
        uses: lingodotdev/lingo.dev@main
        with:
          api-key: ${{ secrets.LINGODOTDEV_API_KEY }}
          commit-message: "chore: update translations"
          working-directory: apps/web
          commit-author-name: "${{ github.actor }}"
          commit-author-email: "${{ github.actor }}@users.noreply.github.com"
          parallel: true

      - name: Compile translations
        working-directory: apps/web
        run: pnpm lingui:compile

      - name: Commit compiled translations
        id: commit
        run: |
          git config --local user.email "${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"
          if ls apps/web/src/locales/*/messages.ts 1> /dev/null 2>&1; then
            git add apps/web/src/locales/*/messages.ts
            if ! git diff --staged --quiet; then
              branch="chore/translations-${{ github.run_id }}"
              git checkout -b "$branch"
              git commit -m "chore: compile translations"
              git push origin "$branch"
              echo "branch=$branch" >> "$GITHUB_OUTPUT"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      # main exige PR com test+e2e verdes mesmo para o bot (enforce_admins
      # já é false, mas o GITHUB_TOKEN não tem o bypass de admin) — então
      # a catalogação vai por PR com auto-merge, igual a qualquer outra
      # mudança neste repo, em vez de push direto (que o GH006 recusa).
      - name: Open PR and enable auto-merge
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base main --head "${{ steps.commit.outputs.branch }}" \
            --title "chore: compile translations" \
            --body "Catálogos de tradução recompilados automaticamente após o extract/lingo.dev."
          gh pr merge "${{ steps.commit.outputs.branch }}" --auto --squash
